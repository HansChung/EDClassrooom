{% extends "base.html" %}
{% block title %}新增借用{% endblock %}
{% block content %}
<h2 class="h4 mb-3">新增借用申請</h2>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">教室</label>
      <select name="classroom_id" class="form-select" required>
        {% for room in rooms %}
          <option value="{{ room.id }}">{{ room.code }} {{ room.name }} ({{ room.capacity }}人)</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">活動名稱</label>
      <input name="title" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">預計人數</label>
      <input name="attendee_count" type="number" class="form-control" min="1" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">開始時間</label>
      <input name="start_at" type="datetime-local" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">結束時間</label>
      <input name="end_at" type="datetime-local" class="form-control" required>
    </div>
    <div class="col-12">
      <label class="form-label">用途說明</label>
      <textarea name="purpose" class="form-control" rows="3" required></textarea>
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">送出申請</button>
  </div>
</form>
{% endblock %}
